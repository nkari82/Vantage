<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vantage Dashboard</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #121a2b;
        --border: #24314a;
        --text: #e5edf8;
        --muted: #93a4bf;
        --ok: #22c55e;
        --warn: #f59e0b;
        --bad: #ef4444;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, Arial, sans-serif; background: var(--bg); color: var(--text); }
      .wrap { max-width: 1280px; margin: 0 auto; padding: 20px; }
      h1 { margin: 0 0 6px; }
      .muted { color: var(--muted); }
      .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); margin-top: 16px; }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
      .card h3 { margin: 0 0 10px; font-size: 16px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      button { border: 0; border-radius: 8px; padding: 8px 12px; background: #334155; color: #fff; cursor: pointer; }
      button:hover { background: #475569; }
      button.active { background: #0369a1; }
      .pill { padding: 3px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); }
      .ok { color: var(--ok); }
      .warn { color: var(--warn); }
      .bad { color: var(--bad); }
      .kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; font-size: 14px; }
      .bar { height: 8px; background: #0a1020; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
      .bar > div { height: 100%; background: #0ea5e9; }
      pre { margin: 0; max-height: 220px; overflow: auto; background: #020617; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 12px; }
      select, input[type='number'], input[type='range'] { background: #0f172a; color: #e5edf8; border: 1px solid var(--border); border-radius: 6px; padding: 6px; }
      .section-title { margin-top: 18px; margin-bottom: 8px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Vantage Dashboard</h1>
      <div class="muted">저전력 ↔ 고성능 자동 전환 / Gateway / GPU / AK620 / Logs 통합</div>

      <div class="grid">
        <div class="card">
          <h3>Overview</h3>
          <div id="overview" class="kv"></div>
        </div>

        <div class="card">
          <h3>System Control</h3>
          <div class="row">
            <button onclick="confirmRestart()" class="warn">Restart</button>
            <button onclick="confirmShutdown()" class="bad">Shutdown</button>
          </div>
        </div>

        <div class="card">
          <h3>Power Mode</h3>
          <div class="row" id="modeButtons"></div>
          <div class="muted" style="margin-top:8px">Turbo는 수동 모드로만 사용 권장</div>
        </div>

        <div class="card">
          <h3>LLM Gateway</h3>
          <div class="row" style="margin-bottom:10px">
            <label class="row" style="gap:6px">
              <input id="gatewayEnabled" type="checkbox" /> Enabled
            </label>
            <span id="gatewayState" class="pill">-</span>
            <span id="llmState" class="pill">-</span>
          </div>
          <div class="kv" id="gatewayInfo"></div>
          <div class="row" style="margin-top:10px">
            <button onclick="startLlm()">vLLM Start</button>
            <button onclick="stopLlm()">vLLM Stop</button>
            <button onclick="touchLlm()">Touch</button>
          </div>
        </div>

        <div class="card">
          <h3>GPU</h3>
          <div id="gpuCards"></div>
        </div>

        <div class="card">
          <h3>AK620</h3>
          <div id="ak620Info" class="kv"></div>
          <div class="section-title">순환 주기 설정</div>
          <div class="row">
            <input id="ak620Range" type="range" min="1" max="60" step="1" value="4" />
            <input id="ak620Value" type="number" min="1" max="60" value="4" style="width:80px" />
            <button onclick="saveAk620Interval()">적용</button>
          </div>
          <div class="muted" id="ak620Hint">저전력 모드에서는 8초 이상 권장</div>
        </div>

        <div class="card" style="grid-column: 1 / -1;">
          <h3>Logs</h3>
          <div class="row" style="margin-bottom:8px">
            <select id="logService">
              <option>vantage-backend.service</option>
              <option>vantage-llm-gateway.service</option>
              <option>vllm-coder.service</option>
              <option>vantage-ak620-agent.service</option>
              <option>vantage-dashboard.service</option>
            </select>
            <input id="logLines" type="number" min="20" max="300" value="80" style="width:90px" />
            <button onclick="loadLogs()">로그 새로고침</button>
          </div>
          <pre id="logs">loading...</pre>
        </div>
      </div>
    </div>

    <script>
      const backendBase = `${location.protocol}//${location.hostname}:18080`;
      const modeList = ["LOW_POWER", "STANDARD_250", "STANDARD_280", "TURBO", "ADAPTIVE"];
      let latestStatus = null;

      async function api(path, options = {}) {
        const response = await fetch(`${backendBase}${path}`, {
          headers: { "content-type": "application/json" },
          ...options,
        });
        const text = await response.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch (_) { data = { raw: text }; }
        if (!response.ok) {
          throw new Error(data?.message || data?.error || `HTTP ${response.status}`);
        }
        return data;
      }

      function fmtTs(ts) {
        if (!ts) return "-";
        return new Date(ts).toLocaleString();
      }

      function setModeButtons(activeMode) {
        const root = document.getElementById("modeButtons");
        root.innerHTML = "";
        modeList.forEach((mode) => {
          const btn = document.createElement("button");
          btn.textContent = mode;
          if (mode === activeMode) btn.classList.add("active");
          btn.onclick = () => setMode(mode);
          root.appendChild(btn);
        });
      }

      function renderOverview(status) {
        const totalPower = (status.gpus || []).reduce((acc, g) => acc + (g.powerW || 0), 0);
        const maxTemp = Math.max(0, ...(status.gpus || []).map((g) => g.temperatureC || 0));
        const html = [
          ["Current Mode", status.mode],
          ["Total GPU Power", `${totalPower.toFixed(1)} W`],
          ["LLM Ready", status.llmReady ? "Running" : "Stopped"],
          ["Gateway Enabled", String(status.gateway.enabled)],
          ["Max GPU Temp", `${maxTemp} °C`],
          ["Last Request", fmtTs(status.gateway.lastUsedAt)],
        ].map(([k, v]) => `<div class='muted'>${k}</div><div>${v}</div>`).join("");
        document.getElementById("overview").innerHTML = html;
      }

      function renderGateway(status) {
        const gateway = status.gateway;
        document.getElementById("gatewayEnabled").checked = gateway.enabled;
        document.getElementById("gatewayState").textContent = gateway.enabled ? "Gateway ON" : "Gateway OFF";
        document.getElementById("gatewayState").className = `pill ${gateway.enabled ? "ok" : "warn"}`;

        document.getElementById("llmState").textContent = status.llmReady ? "vLLM Running" : "vLLM Stopped";
        document.getElementById("llmState").className = `pill ${status.llmReady ? "ok" : "warn"}`;

        document.getElementById("gatewayInfo").innerHTML = [
          ["Upstream URL", gateway.upstreamUrl],
          ["Gateway Port", gateway.listenPort],
          ["Idle Timeout", `${gateway.idleTimeoutMinutes} min`],
          ["Idle Remaining", `${gateway.idleRemainingSeconds}s`],
          ["Last Request", fmtTs(gateway.lastUsedAt)],
        ].map(([k, v]) => `<div class='muted'>${k}</div><div>${v}</div>`).join("");
      }

      function renderGpu(status) {
        const root = document.getElementById("gpuCards");
        root.innerHTML = "";
        (status.gpus || []).forEach((g) => {
          const util = Math.max(0, Math.min(100, g.utilization || 0));
          const memPct = g.memoryTotalMiB > 0 ? (g.memoryUsedMiB / g.memoryTotalMiB) * 100 : 0;

          const div = document.createElement("div");
          div.style.marginBottom = "10px";
          div.innerHTML = `
            <div class='row' style='justify-content:space-between'>
              <strong>GPU${g.index}</strong>
              <span>${g.temperatureC}°C / ${g.powerW}W (limit ${g.powerLimitW}W)</span>
            </div>
            <div class='muted'>Utilization ${util}%</div>
            <div class='bar'><div style='width:${util}%'></div></div>
            <div class='muted' style='margin-top:4px'>VRAM ${g.memoryUsedMiB} / ${g.memoryTotalMiB} MiB (${memPct.toFixed(1)}%)</div>
            <div class='bar'><div style='width:${Math.max(0, Math.min(100, memPct))}%; background:#22c55e'></div></div>
          `;
          root.appendChild(div);
        });

        if ((status.gpus || []).length === 0) {
          root.innerHTML = "<div class='warn'>GPU 데이터 없음 (nvidia-smi 확인 필요)</div>";
        }
      }

      function renderAk620(status) {
        const ak = status.ak620;
        document.getElementById("ak620Info").innerHTML = [
          ["Connected", String(ak.connected)],
          ["Current Target", ak.currentTarget],
          ["Bar Level", `${ak.barLevel}`],
          ["Temperature", `${ak.temperatureC} °C`],
          ["Refresh Interval", `${ak.refreshIntervalSeconds}s (min ${ak.minRefreshInterval}, max ${ak.maxRefreshInterval})`],
        ].map(([k, v]) => `<div class='muted'>${k}</div><div>${v}</div>`).join("");

        const range = document.getElementById("ak620Range");
        const number = document.getElementById("ak620Value");
        range.min = String(ak.minRefreshInterval);
        range.max = String(ak.maxRefreshInterval);
        number.min = String(ak.minRefreshInterval);
        number.max = String(ak.maxRefreshInterval);

        if (String(range.value) !== String(ak.refreshIntervalSeconds)) {
          range.value = String(ak.refreshIntervalSeconds);
          number.value = String(ak.refreshIntervalSeconds);
        }
      }

      async function confirmRestart() {
        if (!confirm("시스템을 재시작하시겠습니까?")) return;
        try {
          await api("/api/system/reboot", { method: "POST", body: "{}" });
          alert("재시작 명령 전송됨...");
        } catch (e) {
          alert(`재시작 실패: ${e.message}`);
        }
      }

      async function confirmShutdown() {
        if (!confirm("시스템을 종료하시겠습니까?")) return;
        try {
          await api("/api/system/shutdown", { method: "POST", body: "{}" });
          alert("종료 명령 전송됨...");
        } catch (e) {
          alert(`종료 실패: ${e.message}`);
        }
      }
        try {
          const status = await api("/api/status");
          latestStatus = status;
          setModeButtons(status.mode);
          renderOverview(status);
          renderGateway(status);
          renderGpu(status);
          renderAk620(status);
        } catch (error) {
          console.error(error);
        }
      }

      async function setMode(mode) {
        try {
          await api("/api/mode", { method: "POST", body: JSON.stringify({ mode }) });
          await refreshStatus();
        } catch (error) {
          alert(`모드 변경 실패: ${error.message}`);
        }
      }

      async function toggleGateway(enabled) {
        try {
          await api("/api/llm-gateway/enabled", { method: "POST", body: JSON.stringify({ enabled }) });
          await refreshStatus();
        } catch (error) {
          alert(`Gateway 설정 실패: ${error.message}`);
        }
      }

      async function startLlm() {
        try {
          await api("/api/llm/start", { method: "POST", body: "{}" });
          await refreshStatus();
        } catch (error) {
          alert(`vLLM 시작 실패: ${error.message}`);
        }
      }

      async function stopLlm() {
        try {
          await api("/api/llm/stop", { method: "POST", body: "{}" });
          await refreshStatus();
        } catch (error) {
          alert(`vLLM 중지 실패: ${error.message}`);
        }
      }

      async function touchLlm() {
        try {
          await api("/api/llm/touch", { method: "POST", body: "{}" });
          await refreshStatus();
        } catch (error) {
          alert(`touch 실패: ${error.message}`);
        }
      }

      async function saveAk620Interval() {
        const seconds = Number(document.getElementById("ak620Value").value);
        try {
          const res = await api("/api/ak620/refresh-interval", { method: "POST", body: JSON.stringify({ seconds }) });
          document.getElementById("ak620Hint").textContent = res.note || "적용 완료";
          await refreshStatus();
        } catch (error) {
          alert(`AK620 주기 설정 실패: ${error.message}`);
        }
      }

      async function loadLogs() {
        const service = document.getElementById("logService").value;
        const lines = Number(document.getElementById("logLines").value);
        try {
          const data = await api(`/api/logs?service=${encodeURIComponent(service)}&lines=${encodeURIComponent(lines)}`);
          document.getElementById("logs").textContent = (data.lines || []).join("\n");
        } catch (error) {
          document.getElementById("logs").textContent = `로그 로드 실패: ${error.message}`;
        }
      }

      document.getElementById("gatewayEnabled").addEventListener("change", (e) => {
        toggleGateway(Boolean(e.target.checked));
      });

      const akRange = document.getElementById("ak620Range");
      const akValue = document.getElementById("ak620Value");
      akRange.addEventListener("input", () => { akValue.value = akRange.value; });
      akValue.addEventListener("input", () => { akRange.value = akValue.value; });

      refreshStatus();
      loadLogs();
      setInterval(refreshStatus, 5000);
      setInterval(loadLogs, 10000);
    </script>
  </body>
</html>
